{% extends 'blog/base.html' %}

{% block content %}
  <h1>Blog das Divas</h1>
  <br>
  <h1>Últimas Postagens</h1>
  

  <div class="lista-albuns"> 
    
    {% for post in posts %}
      <div class="card-album">
        
        <h2>{{ post.titulo }}</h2>
        <!--filtro date -->
        <p>Publicado em: {{ post.data_post|date:"d/m/Y" }}</p>
        
       
        <a href="{% url 'post_detail' post.id %}">Ler postagem</a>
      
      </div>
    {% empty %}
      <p>Ainda não há postagens publicadas.</p>
    {% endfor %}

  </div>
{% endblock %}
